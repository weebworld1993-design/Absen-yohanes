    <!DOCTYPE html>
    <html>
    <head>
    <title>Absen Online SMAN 4</title>
    <style>
    body{background:linear-gradient(#667eea,#764ba2);font-family:Arial;text-align:center;padding:20px;color:white}
    .box{background:white;padding:20px;border-radius:10px;max-width:400px;margin:auto;color:black}
    input,button{padding:12px;margin:8px;width:90%;border-radius:5px;border:1px solid #ccc}
    button{background:#667eea;color:white;border:none;font-weight:bold;cursor:pointer}
    </style>
    </head>
    <body>
    <h1>📋 Absen Online SMAN 4</h1>
    <div class="box">
    <form id="formAbsen">
      <input type="text" name="nama" placeholder="Nama Lengkap" required>
      <input type="text" name="kelas" placeholder="Kelas" required>
      <input type="text" name="kehadiran" placeholder="Hadir/Izin/Sakit" required>
      <button type="submit">Kirim Absen</button>
    </form>
    </div>

    <script>
    const URL = 'https://script.google.com/macros/s/AKfycbzFcot-DkXyLTMs8s-_7IOyoNyQSCxEEFK_fiqaMc5TUhZWqzccNt9nEODxqpcYPVCYJw/exec';

    document.getElementById('formAbsen').addEventListener('submit', (e) => {
      e.preventDefault();
      fetch(URL, { method: 'POST', body: new FormData(e.target) })
      .then(res => res.text())
      .then(data => { alert('Absen berhasil dikirim! ✅'); e.target.reset(); })
      .catch(error => { alert('Gagal kirim absen! Coba lagi 😭'); });
    });
    </script>
    </body>
    </html>
