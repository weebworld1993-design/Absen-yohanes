<!DOCTYPE html>
<html>
<head>
<title>Galeri Teman</title>
<style>
body{background:linear-gradient(#667eea,#764ba2);padding:20px;text-align:center;color:white}
.box{background:white;padding:15px;border-radius:10px;margin-bottom:20px}
input,button{padding:10px;margin:5px;border-radius:8px;border:none}
button{background:#667eea;color:white;font-weight:bold}
.galeri{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.card{background:white;border-radius:10px;overflow:hidden;color:black}
.card img{width:100%;height:180px;object-fit:cover}
.info{padding:10px}
</style>
</head>
<body>
<h1>📸 Galeri Teman</h1>

<div class="box">
<input type="file" id="foto" accept="image/*"><br>
<input type="text" id="nama" placeholder="Nama Teman"><br>
<textarea id="ucap" placeholder="Ucapan" style="width:90%;padding:10px"></textarea><br>
<button onclick="simpan()">Simpan Foto</button>
</div>

<div class="galeri" id="hasil"></div>

<script>
let data=JSON.parse(localStorage.data||'[]');
function tampil(){
hasil.innerHTML='';
data.map((d,i)=>hasil.innerHTML+=`<div class="card"><img src="${d.f}"><div class="info"><b>${d.n}</b><p>"${d.u}"</p><button onclick="hapus(${i})">Hapus</button></div></div>`)
}
function simpan(){
let f=foto.files[0];if(!f||!nama.value)return alert('Pilih foto & isi nama');
let r=new FileReader();
r.onload=e=>{data.push({f:e.target.result,n:nama.value,u:ucap.value});localStorage.data=JSON.stringify(data);tampil();foto.value='';nama.value='';ucap.value=''}
r.readAsDataURL(f)
}
function hapus(i){data.splice(i,1);localStorage.data=JSON.stringify(data);tampil()}
tampil()
</script>
</body>
</html>
